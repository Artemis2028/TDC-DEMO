name: build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      GODOT: 4.7-stable
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build the rules sim, its tests and the Godot extension
        run: |
          cmake -S . -B build
          cmake --build build --config Release -j 4
          ctest --test-dir build -C Release --output-on-failure

      - name: Fetch Godot and its export templates
        shell: pwsh
        run: |
          $v = "$env:GODOT"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$v/Godot_v${v}_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$v/Godot_v${v}_export_templates.tpz" -OutFile templates.zip
          Expand-Archive templates.zip -DestinationPath tpl
          $dest = "$env:APPDATA\Godot\export_templates\$($v -replace '-', '.')"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Move-Item tpl\templates\* $dest

      - name: Stamp the build number and commit into the version shown in the game
        shell: pwsh
        run: |
          $f = "game/scripts/version.gd"
          $b = "${{ github.run_number }} (" + "${{ github.sha }}".Substring(0, 7) + ")"
          (Get-Content $f -Raw).Replace('const BUILD := "dev"', "const BUILD := `"$b`"") | Set-Content $f -NoNewline
          Select-String -Path $f -Pattern "const BUILD"

      - name: Export the Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force export | Out-Null
          $g = (Get-ChildItem godot -Filter *console.exe -Recurse)[0].FullName
          & $g --headless --path game --import
          & $g --headless --path game --export-release "Windows Desktop" ../export/TDC-Demo.exe
          Copy-Item LICENSE.txt export/
          Get-ChildItem export

      - name: Write the SHA-256 hash of the exe (to match against VirusTotal scans)
        shell: pwsh
        run: |
          $h = (Get-FileHash export/TDC-Demo.exe -Algorithm SHA256).Hash.ToLower()
          $v = (Select-String -Path game/scripts/version.gd -Pattern 'const NUMBER := "(.*)"').Matches[0].Groups[1].Value
          $b = "${{ github.run_number }} (" + "${{ github.sha }}".Substring(0, 7) + ")"
          "TDC Demo v$v · build $b`n`nSHA-256  $h  TDC-Demo.exe`n" | Set-Content export/SHA256.txt -NoNewline
          Get-Content export/SHA256.txt
          "### TDC-Demo.exe SHA-256`n``$h``" | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - uses: actions/upload-artifact@v4
        with:
          name: TDC-Demo-windows
          path: export/
